[project]
name = "beeproof"
version = "0.1.0"
description = "BeeProof AI backend: evidence-first extraction of bank rate sheets"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "pymupdf>=1.24",
  "pillow>=10.4",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "reportlab>=4.2",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.9",
  "tenacity>=8.5",
  "redis>=5.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
gcp = [
  "google-genai>=1.0",
  "google-cloud-documentai>=2.29",
  "google-cloud-storage>=2.18",
  "google-cloud-tasks>=2.16",
]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.6", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["beeproof*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["beeproof/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# B008: FastAPI's Depends()/File() defaults; E501: line length is left to the formatter
ignore = ["B008", "E501", "UP007", "UP045", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
